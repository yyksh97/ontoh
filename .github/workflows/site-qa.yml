name: 홈페이지 품질 검사

# PR 을 올리거나 커밋을 추가할 때마다 실행. 필요하면 Actions 탭에서 직접 실행도 가능.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/qa/package-lock.json

      - name: 검사 도구 설치
        working-directory: .github/qa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 로컬 서버 시작
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/index.html >/dev/null && break; sleep 1; done

      - name: 접근성 · 모바일 넘침 · 키보드 포커스 검사
        run: node .github/qa/site-qa.mjs http://127.0.0.1:8080/
